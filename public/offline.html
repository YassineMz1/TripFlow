<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline - TripFlow</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card-bg: white;
        --text: #0f172a;
        --text-muted: #475569;
        --button-bg: #0ea5a4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1724;
          --card-bg: #1a2332;
          --text: #e2e8f0;
          --text-muted: #94a3b8;
          --button-bg: #0ea5a4;
        }
      }
      body { 
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; 
        display:flex; 
        align-items:center; 
        justify-content:center; 
        min-height:100vh; 
        margin:0; 
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      .card { 
        text-align:center; 
        padding:32px; 
        border-radius:16px; 
        box-shadow:0 6px 24px rgba(0,0,0,0.1); 
        background: var(--card-bg);
        max-width:420px;
        width: 100%;
      }
      h1 { 
        margin:0 0 12px; 
        font-size:24px;
        font-weight: 700;
      }
      p { 
        margin:0 0 24px; 
        color: var(--text-muted);
        line-height: 1.6;
      }
      .buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      a.button { 
        display:inline-block; 
        padding:12px 24px; 
        border-radius:8px; 
        background: var(--button-bg);
        color:white; 
        text-decoration:none;
        font-weight: 600;
        transition: transform 0.2s;
      }
      a.button:hover {
        transform: translateY(-2px);
      }
      a.button.secondary {
        background: transparent;
        color: var(--text);
        border: 2px solid var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📱 You're offline</h1>
      <p>TripFlow is currently offline. You can still browse cached pages like Home, Hotels, and Profile. Live content and new searches require an internet connection.</p>
      <div class="buttons">
        <a class="button" href="/">Go to Home</a>
        <a class="button secondary" href="/hotels">View Hotels</a>
      </div>
    </div>
  </body>
</html>
