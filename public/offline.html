<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline - TripFlow</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f8fafc; color:#0f172a }
      .card { text-align:center; padding:24px; border-radius:12px; box-shadow:0 6px 18px rgba(15,23,42,0.06); background:white; max-width:420px }
      h1 { margin:0 0 8px; font-size:20px }
      p { margin:0 0 12px; color:#475569 }
      a.button { display:inline-block; padding:10px 14px; border-radius:8px; background:#0ea5a4; color:white; text-decoration:none }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>TripFlow is offline. You can still view the app shell, but live content requires an internet connection.</p>
      <a class="button" href="/">Open app shell</a>
    </div>
  </body>
</html>
